# SonarQube Cloud automatic analysis reads this file (not sonar-project.properties).
# Automatic analysis does not import coverage reports.
sonar.sources=backend/app,backend/scripts,backend/alembic,frontend/src,frontend/scripts,frontend/public/_worker.js,scripts
sonar.tests=backend/tests,frontend/src/test,frontend/e2e,frontend/scripts,scripts
sonar.exclusions=frontend/src/test/**,**/*.test.mjs,backend/alembic/versions/**
sonar.test.inclusions=backend/tests/**,frontend/src/test/**,frontend/e2e/**,**/*.test.mjs
sonar.python.version=3.14
