name: cronos-ci

x-runtime-environment: &runtime-environment
  ENVIRONMENT: local
  DATABASE_URL: postgresql+asyncpg://cronos_app:${CRONOS_APP_PASSWORD:?CRONOS_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-cronos_ci_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  RATELIMIT_ENABLED: "true"
  RESEND_API_KEY: test-resend-key
  CONTACT_EMAIL_FROM: website@forms.cronos.pt
  CONTACT_EMAIL_TO: contacto@cronos.pt
  CONTACT_EMAIL_TIMEOUT_SECONDS: "10"
  # Cloudflare's public always-pass test secret. It is not a production credential.
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  TURNSTILE_ALLOWED_HOSTNAMES: localhost,cronos.pt,www.cronos.pt
  TURNSTILE_TIMEOUT_SECONDS: "5"

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    tmpfs:
      - /var/lib/postgresql/data:size=1073741824
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cronos_ci_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-cronos_ci_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  provision-db:
    profiles: [maintenance]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    command: ["/bin/sh", "/scripts/provision_database.sh"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-cronos_ci_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: db
      CRONOS_MIGRATOR_PASSWORD: ${CRONOS_MIGRATOR_PASSWORD:?CRONOS_MIGRATOR_PASSWORD is required}
      CRONOS_APP_PASSWORD: ${CRONOS_APP_PASSWORD:?CRONOS_APP_PASSWORD is required}
    volumes:
      - ./backend/scripts/provision_database.sh:/scripts/provision_database.sh:ro
    depends_on:
      db: {condition: service_healthy}

  db-maintenance:
    profiles: [maintenance]
    image: cronos-backend-ci:local
    command: ["alembic", "upgrade", "head"]
    environment:
      # Settings validates DATABASE_URL before Alembic replaces the SQLAlchemy
      # URL with MIGRATION_DATABASE_URL below.
      DATABASE_URL: postgresql+psycopg2://cronos_migrator:${CRONOS_MIGRATOR_PASSWORD:?CRONOS_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB:-cronos_ci_db}
      MIGRATION_DATABASE_URL: postgresql+psycopg2://cronos_migrator:${CRONOS_MIGRATOR_PASSWORD:?CRONOS_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB:-cronos_ci_db}
    depends_on:
      db: {condition: service_healthy}

  backend:
    image: cronos-backend-ci:local
    build:
      context: ./backend
      target: ci
    environment:
      <<: *runtime-environment
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      # E2E exercises Clerk authentication, not inbound webhook delivery. The
      # application handles an unset webhook secret by returning 503 on that
      # endpoint, so CI should not require an unrelated credential to start.
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      FRONTEND_URL: http://localhost:5173
      CLERK_AUTHORIZED_PARTIES: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
  worker:
    image: cronos-backend-ci:local
    command: ["celery", "-A", "app.celery_worker.celery_app", "worker", "--loglevel=info", "--include=app.scheduler_worker", "--concurrency=1", "--prefetch-multiplier=1", "--max-tasks-per-child=1"]
    environment:
      <<: *runtime-environment
      DATABASE_POOLING_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    image: cronos-backend-ci:local
    command: ["celery", "-A", "app.celery_worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *runtime-environment
      DATABASE_POOLING_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      target: ci
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
        VITE_API_BASE_URL: /api/v1
        # Cloudflare's public always-pass test site key.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
