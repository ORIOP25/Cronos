name: cronos-ci

x-runtime-environment: &runtime-environment
  ENVIRONMENT: local
  DATABASE_URL: postgresql+asyncpg://cronos_app:${CRONOS_APP_PASSWORD:?CRONOS_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-cronos_ci_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  RATELIMIT_ENABLED: "true"

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cronos_ci_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-cronos_ci_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  provision-db:
    profiles: [maintenance]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    command: ["/bin/sh", "/scripts/provision_database.sh"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-cronos_ci_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: db
      CRONOS_MIGRATOR_PASSWORD: ${CRONOS_MIGRATOR_PASSWORD:?CRONOS_MIGRATOR_PASSWORD is required}
      CRONOS_APP_PASSWORD: ${CRONOS_APP_PASSWORD:?CRONOS_APP_PASSWORD is required}
    volumes:
      - ./backend/scripts/provision_database.sh:/scripts/provision_database.sh:ro
    depends_on:
      db: {condition: service_healthy}

  db-maintenance:
    profiles: [maintenance]
    image: cronos-backend-ci:local
    command: ["alembic", "upgrade", "head"]
    environment:
      # Settings validates DATABASE_URL before Alembic replaces the SQLAlchemy
      # URL with MIGRATION_DATABASE_URL below.
      DATABASE_URL: postgresql+psycopg2://cronos_migrator:${CRONOS_MIGRATOR_PASSWORD:?CRONOS_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB:-cronos_ci_db}
      MIGRATION_DATABASE_URL: postgresql+psycopg2://cronos_migrator:${CRONOS_MIGRATOR_PASSWORD:?CRONOS_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB:-cronos_ci_db}
    depends_on:
      db: {condition: service_healthy}

  backend:
    image: cronos-backend-ci:local
    build:
      context: ./backend
      target: ci
    environment:
      <<: *runtime-environment
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      # E2E exercises Clerk authentication, not inbound webhook delivery. The
      # application handles an unset webhook secret by returning 503 on that
      # endpoint, so CI should not require an unrelated credential to start.
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      FRONTEND_URL: http://localhost:5173
      CLERK_AUTHORIZED_PARTIES: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24

  worker:
    image: cronos-backend-ci:local
    command: ["celery", "-A", "app.celery_worker.celery_app", "worker", "--loglevel=info", "--include=app.scheduler_worker", "--autoscale=2,1", "--prefetch-multiplier=1", "--max-tasks-per-child=1"]
    environment:
      <<: *runtime-environment
      DATABASE_POOLING_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    image: cronos-backend-ci:local
    command: ["celery", "-A", "app.celery_worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *runtime-environment
      DATABASE_POOLING_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    network_mode: host
    working_dir: /work/frontend
    command: ["/bin/sh", "-c", "npm ci && npm run test:e2e"]
    environment:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "1"
      BASE_URL: http://localhost:5173
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      E2E_CLERK_ADMIN_EMAIL: ${E2E_CLERK_ADMIN_EMAIL:?E2E_CLERK_ADMIN_EMAIL is required}
      E2E_CLERK_TEACHER_EMAIL: ${E2E_CLERK_TEACHER_EMAIL:?E2E_CLERK_TEACHER_EMAIL is required}
      E2E_CLERK_INVITE_CREATE_EMAIL: ${E2E_CLERK_INVITE_CREATE_EMAIL:?E2E_CLERK_INVITE_CREATE_EMAIL is required}
      E2E_CLERK_INVITE_CONVERT_EMAIL: ${E2E_CLERK_INVITE_CONVERT_EMAIL:?E2E_CLERK_INVITE_CONVERT_EMAIL is required}
    volumes:
      # Docker must create the nested node_modules mountpoint below this path.
      # CI uses an ephemeral checkout, so this mount can safely be writable.
      - ./frontend:/work/frontend
      - frontend_node_modules_ci:/work/frontend/node_modules
    depends_on:
      frontend: {condition: service_healthy}
      worker: {condition: service_started}
      beat: {condition: service_started}

volumes:
  frontend_node_modules_ci:
