name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/0
  ENVIRONMENT: local
  SENTRY_DSN: ""
  DATABASE_POOLING_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cronos_test_db
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data:size=1073741824
          --health-cmd "pg_isready -U postgres -d cronos_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Generate ephemeral backend credentials
        shell: bash
        run: |
          CI_MIGRATOR_PASSWORD="$(openssl rand -hex 24)"
          CI_APP_PASSWORD="$(openssl rand -hex 24)"
          echo "CI_MIGRATOR_PASSWORD=${CI_MIGRATOR_PASSWORD}" >> "$GITHUB_ENV"
          echo "CI_APP_PASSWORD=${CI_APP_PASSWORD}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://cronos_app:${CI_APP_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+asyncpg://cronos_app:${CI_APP_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgresql+psycopg2://cronos_migrator:${CI_MIGRATOR_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
      - name: Provision database roles
        run: |
          psql postgresql://postgres@localhost/cronos_test_db <<SQL
          CREATE ROLE cronos_migrator LOGIN NOSUPERUSER BYPASSRLS PASSWORD '${CI_MIGRATOR_PASSWORD}';
          CREATE ROLE cronos_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '${CI_APP_PASSWORD}';
          CREATE ROLE cronos_auth_definer NOLOGIN NOSUPERUSER BYPASSRLS;
          GRANT cronos_auth_definer TO cronos_migrator;
          ALTER DATABASE cronos_test_db OWNER TO cronos_migrator;
          GRANT CONNECT ON DATABASE cronos_test_db TO cronos_app;
          SQL
          for worker_db in cronos_test_gw0 cronos_test_gw1 cronos_test_gw2 cronos_test_gw3; do
            psql postgresql://postgres@localhost/postgres \
              --set=ON_ERROR_STOP=1 --set=db_name="$worker_db" <<'SQL'
          SELECT format('CREATE DATABASE %I OWNER cronos_migrator', :'db_name')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name')\gexec
          GRANT CONNECT ON DATABASE :"db_name" TO cronos_app;
          SQL
          done
      - name: Install locked dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency locks
        working-directory: backend
        run: |
          pip-compile --quiet --allow-unsafe --generate-hashes --output-file=requirements.txt requirements.in
          pip-compile --quiet --allow-unsafe --generate-hashes --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt
          pip check
          # ponytail: remove these temporary exceptions when the Clerk lock supports cryptography >=50.
          # Cronos does not call pkcs7_decrypt_* or cryptography.x509.verification.
          # Retry the normal Clerk dependency update on every lock refresh.
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554
      - name: Ruff
        working-directory: backend
        run: |
          ruff format --check .
          ruff check .
      - name: Verify immutable migration
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Audit database constraints
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          python -m scripts.audit_triggers
          python -m scripts.audit_database_integrity
      - name: Test backend units
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "false"
        run: >-
          pytest -q tests/unit --cov=app --cov-branch --cov-report= --cov-fail-under=0
          --disable-socket --allow-hosts=127.0.0.1,localhost
          --junitxml=test-results-unit.xml
      - name: Test backend integrations
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "false"
        run: >-
          pytest -q tests/integration --cov=app --cov-branch --cov-report= --cov-fail-under=0 --cov-append
          -n 4 --dist=loadscope --junitxml=test-results-integration.xml
      - name: Test backend contracts and report coverage
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "true"
        run: |
          pytest -q tests/contracts --cov=app --cov-branch --cov-report= --cov-fail-under=0 --cov-append --junitxml=test-results-contracts.xml
          coverage report --fail-under=70
          coverage report --include='app/scheduler/domain/constraints.py,app/scheduler/domain/validation.py' --fail-under=100
          python - <<'PY'
          import xml.etree.ElementTree as ET
          files = ("test-results-unit.xml", "test-results-integration.xml", "test-results-contracts.xml")
          skipped = sum(
              int(x.attrib.get("skipped", 0))
              for path in files
              for x in ET.parse(path).iter("testsuite")
          )
          if skipped:
              raise SystemExit(f"{skipped} skipped tests are not allowed")
          PY
      - name: Build hardened backend image
        run: docker build --target runtime -t cronos-backend:test backend
      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/test-results-*.xml
            backend/htmlcov
            backend/.coverage*
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run audit:production
          npm run verify
      - name: Upload frontend test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/coverage
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: cronos-e2e
    env:
      CI_E2E_CLERK_ADMIN_EMAIL: "cronos-ci-admin+clerk_test@example.com"
      CI_E2E_CLERK_TEACHER_EMAIL: "cronos-ci-teacher+clerk_test@example.com"
      CI_E2E_CLERK_AUTO_PROVISION: "true"
      CI_E2E_CLERK_CREATE_ORGANIZATION: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend E2E dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install chromium

      - name: Validate Clerk test identities
        run: |
          invite_create_email="e2e-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}+clerk_test@example.com"
          invite_convert_email="e2e-convert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}+clerk_test@example.com"
          echo "E2E_CLERK_INVITE_CREATE_EMAIL=${invite_create_email}" >> "$GITHUB_ENV"
          echo "E2E_CLERK_INVITE_CONVERT_EMAIL=${invite_convert_email}" >> "$GITHUB_ENV"
          if [[ "$VITE_CLERK_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo "ERROR: Missing or invalid Clerk publishable key for E2E. Must start with pk_test_"
            exit 1
          fi
          if [[ "$CLERK_SECRET_KEY" != sk_test_* ]]; then
            echo "ERROR: Missing or invalid Clerk server-side E2E auth. Must start with sk_test_"
            exit 1
          fi
          if [ -z "$E2E_CLERK_ADMIN_EMAIL" ] || [ -z "$E2E_CLERK_TEACHER_EMAIL" ]; then
            echo "ERROR: Missing Clerk E2E user emails."
            exit 1
          fi
          case "$E2E_CLERK_ADMIN_EMAIL:$E2E_CLERK_TEACHER_EMAIL" in
            *+clerk_test@example.com:*+clerk_test@example.com) ;;
            *) echo "ERROR: E2E login identities must be dedicated Clerk reserved test users."; exit 1 ;;
          esac
          case "$invite_create_email:$invite_convert_email" in
            *+clerk_test@example.com:*+clerk_test@example.com) ;;
            *) echo "ERROR: Invitation identities must use Clerk reserved test emails."; exit 1 ;;
          esac
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_AUTO_PROVISION: ${{ env.CI_E2E_CLERK_AUTO_PROVISION }}

      - name: Generate ephemeral CI database credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CI_MIGRATOR_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CI_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Build CI backend image
        run: docker compose -f docker-compose.ci.yml build backend
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          CRONOS_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          CRONOS_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Start CI infrastructure
        run: docker compose -f docker-compose.ci.yml up -d --wait db redis
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: cronos_ci_db
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          CRONOS_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          CRONOS_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Provision CI database roles
        run: docker compose -f docker-compose.ci.yml --profile maintenance run --rm provision-db
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: cronos_ci_db
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          CRONOS_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          CRONOS_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Apply CI database migrations
        run: docker compose -f docker-compose.ci.yml --profile maintenance run --rm db-maintenance
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: cronos_ci_db
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          CRONOS_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          CRONOS_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Start full application stack
        run: docker compose -f docker-compose.ci.yml up -d --wait backend worker beat frontend
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: cronos_ci_db
          CRONOS_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          CRONOS_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Prepare E2E Clerk local state
        id: prepare-e2e-clerk-state
        run: |
          clerk_state_json="$(docker compose -f docker-compose.ci.yml exec -T \
            -e CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e E2E_CLERK_ADMIN_EMAIL="$E2E_CLERK_ADMIN_EMAIL" \
            -e E2E_CLERK_TEACHER_EMAIL="$E2E_CLERK_TEACHER_EMAIL" \
            -e E2E_CLERK_AUTO_PROVISION="$E2E_CLERK_AUTO_PROVISION" \
            -e E2E_CLERK_CREATE_ORGANIZATION="$E2E_CLERK_CREATE_ORGANIZATION" \
            backend python scripts/prepare_e2e_clerk_state.py)"
          printf '%s\n' "$clerk_state_json"
          clerk_org_id="$(printf '%s' "$clerk_state_json" | jq -r '.clerk_org_id // empty')"
          if [ -z "$clerk_org_id" ]; then
            echo "E2E Clerk preparation returned no organization ID."
            exit 1
          fi
          echo "clerk_org_id=$clerk_org_id" >> "$GITHUB_OUTPUT"
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: postgresql+asyncpg://cronos_migrator:${{ env.CI_MIGRATOR_PASSWORD }}@db:5432/cronos_ci_db
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_AUTO_PROVISION: ${{ env.CI_E2E_CLERK_AUTO_PROVISION }}
          E2E_CLERK_CREATE_ORGANIZATION: ${{ env.CI_E2E_CLERK_CREATE_ORGANIZATION }}

      - name: Run E2E Tests
        run: node scripts/test.mjs e2e
        env:
          CI: "true"
          E2E_EXTERNAL_STACK: "1"
          BASE_URL: http://localhost:5173
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_WORKERS: "2"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_TEACHER_EMAIL: ${{ env.CI_E2E_CLERK_TEACHER_EMAIL }}
          E2E_CLERK_ORG_ID: ${{ steps.prepare-e2e-clerk-state.outputs.clerk_org_id }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
            .test-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Dump compose logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Revoke E2E Clerk invitations
        if: ${{ always() && steps.prepare-e2e-clerk-state.outcome == 'success' }}
        run: |
          if [ -n "$(docker compose -f docker-compose.ci.yml ps -q backend)" ]; then
            docker compose -f docker-compose.ci.yml exec -T \
              -e CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e E2E_CLERK_ADMIN_EMAIL="$E2E_CLERK_ADMIN_EMAIL" \
              -e E2E_CLERK_INVITE_CREATE_EMAIL="$E2E_CLERK_INVITE_CREATE_EMAIL" \
              -e E2E_CLERK_INVITE_CONVERT_EMAIL="$E2E_CLERK_INVITE_CONVERT_EMAIL" \
              -e E2E_CLERK_DELETE_ORG=true \
              backend python scripts/cleanup_e2e_clerk_invitations.py
          fi
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: postgresql+asyncpg://cronos_migrator:${{ env.CI_MIGRATOR_PASSWORD }}@db:5432/cronos_ci_db
          E2E_CLERK_ADMIN_EMAIL: ${{ env.CI_E2E_CLERK_ADMIN_EMAIL }}
          E2E_CLERK_INVITE_CREATE_EMAIL: ${{ env.E2E_CLERK_INVITE_CREATE_EMAIL }}
          E2E_CLERK_INVITE_CONVERT_EMAIL: ${{ env.E2E_CLERK_INVITE_CONVERT_EMAIL }}

      - name: Stop full application stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans
        env:
          COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
