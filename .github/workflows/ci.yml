name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/0
  ENVIRONMENT: local
  DATABASE_POOLING_ENABLED: "false"

jobs:
  # A squash merge of a green pull request whose head has the same tree as the
  # pushed commit was already tested: skip the suites on main and only verify
  # the deployment. Any difference (main moved, a merge commit) runs everything.
  already-verified:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Find a green pull request head with the same tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          verified=false
          # A GitHub API error only means the shortcut is unproven: the jobs run as usual.
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty') || head=""
          if [ -n "$head" ]; then
            tree() { gh api "repos/$REPO/git/commits/$1" --jq .tree.sha || true; }
            pushed_tree=$(tree "$SHA"); head_tree=$(tree "$head")
            if [ -n "$pushed_tree" ] && [ "$pushed_tree" = "$head_tree" ]; then
              # e2e-browser must have run: a skipped browser job (Dependabot, forks) is no proof.
              green=$(gh api "repos/$REPO/commits/$head/check-runs?filter=latest&per_page=100" \
                --jq '[.check_runs[] | select((.name == "backend" or .name == "frontend" or .name == "e2e-runtime" or .name == "e2e-browser") and .conclusion == "success") | .name] | unique | length') || green=0
              if [ "$green" = 4 ]; then verified=true; fi
            fi
          fi
          echo "Pull request head: ${head:-none}; already verified: $verified"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  backend:
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cronos_test_db
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:size=1073741824
          --health-cmd "pg_isready -U postgres -d cronos_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The critical runner is a Node CLI. Node ships no npm install here; only
      # the standard-library runner executes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate ephemeral backend credentials
        shell: bash
        run: |
          CI_MIGRATOR_PASSWORD="$(openssl rand -hex 24)" # NOSONAR - ephemeral credential generated at execution time, never stored
          CI_APP_PASSWORD="$(openssl rand -hex 24)" # NOSONAR - ephemeral credential generated at execution time, never stored
          echo "::add-mask::${CI_MIGRATOR_PASSWORD}"
          echo "::add-mask::${CI_APP_PASSWORD}"
          echo "CRONOS_MIGRATOR_PASSWORD=${CI_MIGRATOR_PASSWORD}" >> "$GITHUB_ENV"
          echo "CRONOS_APP_PASSWORD=${CI_APP_PASSWORD}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://cronos_app:${CI_APP_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+asyncpg://cronos_app:${CI_APP_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgresql+psycopg2://cronos_migrator:${CI_MIGRATOR_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
      - name: Provision database roles
        env:
          PGHOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_DB: cronos_test_db
        run: |
          sh backend/scripts/provision_database.sh
          for worker_db in cronos_test_gw0 cronos_test_gw1 cronos_test_gw2 cronos_test_gw3; do
            psql postgresql://postgres@localhost/postgres \
              --set=ON_ERROR_STOP=1 --set=db_name="$worker_db" <<'SQL'
          SELECT format('CREATE DATABASE %I OWNER cronos_migrator', :'db_name')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name')\gexec
          GRANT CONNECT ON DATABASE :"db_name" TO cronos_app;
          SQL
          done
      - name: Install locked dependencies
        working-directory: backend
        # The fast job skips eager bytecode compilation of the full dev corpus;
        # imported critical modules still compile normally. It keeps the locked
        # hashes, wheel verification, install, pip check, audit, Ruff, Alembic
        # and integrity gates unchanged.
        run: >-
          python -m pip install --no-compile --require-hashes --only-binary=:all:
          --no-binary=standardwebhooks -r requirements-dev.txt
      # The network dependency audit runs in the background while the CPU/DB
      # gates run in the foreground. A failure in either still fails the job;
      # migrations and audits stay sequential and use the migrator credential
      # for the audits only, so Alembic keeps its own settings.
      - name: Static gates, migrations and dependency audit
        working-directory: backend
        run: |
          set -e
          ( pip check && pip-audit -r requirements.txt --progress-spinner off ) &
          audit_pid=$!
          trap 'kill "$audit_pid" 2>/dev/null || true; wait "$audit_pid" 2>/dev/null || true' EXIT
          ruff format --check .
          ruff check .
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          DATABASE_URL="$MIGRATION_DATABASE_URL" python -m scripts.audit_triggers
          DATABASE_URL="$MIGRATION_DATABASE_URL" python -m scripts.audit_database_integrity
          wait "$audit_pid"
          trap - EXIT
      # The critical core is the fast required gate. The full corpus stays
      # available manually; its cases are deselected here, never deleted.
      # The manifest (backend policy) is the one source of truth for the paths.
      - name: Test backend critical core
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "false"
        run: node ../scripts/test.mjs critical --scope backend
      - name: Build hardened backend image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: docker build --target runtime -t cronos-backend:test backend
      - name: Verify privacy maintenance task in rebuilt image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/cronos_test_db
          cronos-backend:test python -c
          "from app.celery_worker import celery_app; import app.privacy_maintenance_worker; assert 'privacy.run_maintenance' in celery_app.tasks"
      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          # Only the critical report metadata and coverage data. No broad
          # `.test-artifacts` folder, no authentication, binary or profile files.
          # `include-hidden-files` is required because both `.test-artifacts/`
          # and `.coverage*` start with a dot. A missing expected report is a
          # failure, not a warning (htmlcov stays optional).
          path: |
            .test-artifacts/**/critical-*.xml
            .test-artifacts/**/run.json
            backend/htmlcov
            backend/.coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  frontend:
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      # The fast required frontend gate. The frontend policy owns the critical
      # Vitest project/file selection; the full `verify` chain stays available
      # manually and its cases are deselected here, never deleted.
      # `verify:critical:fast` runs the legal, marketing-build and edge
      # contracts, the marketing assets and the critical coverage. The
      # whole-source lint, the production dependency audit, the
      # repository script tests, the production build and the dead-code
      # checks stay mandatory in the long e2e-runtime job.
      - name: Verify frontend critical core
        working-directory: frontend
        run: npm run verify:critical:fast
      - name: Report measured LOC
        run: node scripts/loc-report.mjs
      - name: Upload frontend test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/coverage
            frontend/test-results
          if-no-files-found: warn
          retention-days: 3

  # Real browser browser journeys. Needs Clerk test identities, so it is
  # skipped for Dependabot and fork pull requests.
  e2e-browser:
    needs: already-verified
    if: >-
      !cancelled() && needs.already-verified.outputs.verified != 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: cronos-e2e
    env:
      COMPOSE_PROJECT_NAME: cronos-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: cronos_ci_db
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_ADMIN_EMAIL: "cronos-ci-admin+clerk_test@example.com"
      E2E_CLERK_TEACHER_EMAIL: "cronos-ci-teacher+clerk_test@example.com"
      E2E_CLERK_AUTO_PROVISION: "true"
      # Each run owns a disposable organization: preparation creates a fresh one
      # instead of adopting a shared organization a concurrent run could delete.
      # The cleanup step below then deletes only this run's organization.
      # Founder onboarding still creates a fresh organization in the real flow.
      E2E_CLERK_CREATE_ORGANIZATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend E2E dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install chromium

      - name: Validate Clerk test identities
        run: |
          invite_create_email="e2e-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}+clerk_test@example.com"
          invite_convert_email="e2e-convert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}+clerk_test@example.com"
          echo "E2E_CLERK_INVITE_CREATE_EMAIL=${invite_create_email}" >> "$GITHUB_ENV"
          echo "E2E_CLERK_INVITE_CONVERT_EMAIL=${invite_convert_email}" >> "$GITHUB_ENV"
          if [[ "$VITE_CLERK_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo "ERROR: Missing or invalid Clerk publishable key for E2E. Must start with pk_test_"
            exit 1
          fi
          if [[ "$CLERK_SECRET_KEY" != sk_test_* ]]; then
            echo "ERROR: Missing or invalid Clerk server-side E2E auth. Must start with sk_test_"
            exit 1
          fi
          if [ -z "$E2E_CLERK_ADMIN_EMAIL" ] || [ -z "$E2E_CLERK_TEACHER_EMAIL" ]; then
            echo "ERROR: Missing Clerk E2E user emails."
            exit 1
          fi
          case "$E2E_CLERK_ADMIN_EMAIL:$E2E_CLERK_TEACHER_EMAIL" in
            *+clerk_test@example.com:*+clerk_test@example.com) ;;
            *) echo "ERROR: E2E login identities must be dedicated Clerk reserved test users."; exit 1 ;;
          esac
          case "$invite_create_email:$invite_convert_email" in
            *+clerk_test@example.com:*+clerk_test@example.com) ;;
            *) echo "ERROR: Invitation identities must use Clerk reserved test emails."; exit 1 ;;
          esac

      - name: Generate ephemeral CI database credentials
        shell: bash
        run: |
          for credential_name in POSTGRES_PASSWORD CRONOS_MIGRATOR_PASSWORD CRONOS_APP_PASSWORD; do
            credential_value="$(openssl rand -hex 24)"
            echo "::add-mask::${credential_value}"
            echo "${credential_name}=${credential_value}" >> "$GITHUB_ENV"
          done

      - name: Build CI application images
        # Compose builds both services in parallel, so the frontend image no
        # longer waits for the backend image before `up` starts.
        run: docker compose -f docker-compose.ci.yml build backend frontend

      - name: Verify privacy maintenance task and administrative cleanup in production image
        run: |
          docker build --target runtime -t cronos-backend:test backend
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/cronos_test_db \
            cronos-backend:test python -c \
            "from app.celery_worker import celery_app; import app.privacy_maintenance_worker; import scripts.privacy; assert 'privacy.run_maintenance' in celery_app.tasks"

      - name: Start CI infrastructure
        run: docker compose -f docker-compose.ci.yml up -d --wait db redis

      - name: Provision CI database roles
        run: docker compose -f docker-compose.ci.yml --profile maintenance run --rm provision-db

      - name: Apply CI database migrations
        run: docker compose -f docker-compose.ci.yml --profile maintenance run --rm db-maintenance

      - name: Start full application stack
        run: docker compose -f docker-compose.ci.yml up -d --wait backend worker scheduler-supervisor frontend

      - name: Prepare E2E Clerk local state
        id: prepare-e2e-clerk-state
        run: |
          clerk_state_json="$(docker compose -f docker-compose.ci.yml exec -T \
            -e CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e E2E_CLERK_ADMIN_EMAIL="$E2E_CLERK_ADMIN_EMAIL" \
            -e E2E_CLERK_TEACHER_EMAIL="$E2E_CLERK_TEACHER_EMAIL" \
            -e E2E_CLERK_AUTO_PROVISION="$E2E_CLERK_AUTO_PROVISION" \
            -e E2E_CLERK_CREATE_ORGANIZATION="$E2E_CLERK_CREATE_ORGANIZATION" \
            backend python scripts/prepare_e2e_clerk_state.py)"
          printf '%s\n' "$clerk_state_json"
          clerk_org_id="$(printf '%s' "$clerk_state_json" | jq -r '.clerk_org_id // empty')"
          if [ -z "$clerk_org_id" ]; then
            echo "E2E Clerk preparation returned no organization ID."
            exit 1
          fi
          echo "clerk_org_id=$clerk_org_id" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: postgresql+asyncpg://cronos_migrator:${{ env.CRONOS_MIGRATOR_PASSWORD }}@db:5432/cronos_ci_db

      - name: Run E2E Tests
        id: e2e_tests
        run: node scripts/test.mjs e2e
        env:
          CI: "true"
          E2E_EXTERNAL_STACK: "1"
          BASE_URL: http://localhost:5173
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          # Global fan-out for independent projects only; `app`, `provider`,
          # `isolated`, `readonly` stay at one worker and `auth` is bounded to
          # two in the Playwright config. The runner is authoritative.
          PLAYWRIGHT_WORKERS: "2"
          E2E_CLERK_ORG_ID: ${{ steps.prepare-e2e-clerk-state.outputs.clerk_org_id }}

      - name: Run capacity smoke
        run: node scripts/test.mjs capacity-smoke
        env:
          CI: "true"
          E2E_EXTERNAL_STACK: "1"
          BASE_URL: http://localhost:5173
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_WORKERS: "2"
          E2E_CLERK_ORG_ID: ${{ steps.prepare-e2e-clerk-state.outputs.clerk_org_id }}
          CAPACITY_HEALTH_URL: http://localhost:8000/health/ready
          CAPACITY_REPORT_PATH: playwright-report/capacity-report.json

      - name: Show capacity report
        if: always()
        run: cat frontend/playwright-report/capacity-report.json || true

      - name: Sanitize test artifacts
        id: sanitize
        if: always()
        run: node scripts/sanitize-test-artifacts.mjs .test-artifacts frontend/playwright-report frontend/test-results

      # Timing telemetry must survive a green run. It uploads only sanitized
      # files: the runner `run.json` metadata always, and the Playwright JUnit
      # (`e2e-all.xml`, the same report the runner reads for its truthful suite
      # counts) only when the E2E step passed (no exception bodies). The
      # capacity JUnit stays a separate `.test-artifacts` path. Raw logs,
      # storage state, keys and private profiles stay out.
      - name: Upload E2E metrics
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          # `.test-artifacts/` is hidden, so the glob needs include-hidden-files.
          # A missing run.json (always written) is a failure, not a warning.
          path: |
            .test-artifacts/**/run.json
            ${{ steps.e2e_tests.outcome == 'success' && '.test-artifacts/**/e2e-all.xml' || '' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
            .test-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Dump compose logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
      - name: Revoke E2E Clerk invitations
        if: ${{ always() && steps.prepare-e2e-clerk-state.outcome == 'success' }}
        run: |
          if [ -n "$(docker compose -f docker-compose.ci.yml ps -q backend)" ]; then
            docker compose -f docker-compose.ci.yml exec -T \
              -e CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e E2E_CLERK_ADMIN_EMAIL="$E2E_CLERK_ADMIN_EMAIL" \
              -e E2E_CLERK_INVITE_CREATE_EMAIL="$E2E_CLERK_INVITE_CREATE_EMAIL" \
              -e E2E_CLERK_INVITE_CONVERT_EMAIL="$E2E_CLERK_INVITE_CONVERT_EMAIL" \
              -e E2E_CLERK_DELETE_ORG=true \
              backend python scripts/cleanup_e2e_clerk_invitations.py
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://cronos_migrator:${{ env.CRONOS_MIGRATOR_PASSWORD }}@db:5432/cronos_ci_db

      - name: Stop full application stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans

  # Native cross-layer runtime proof. It needs no Clerk or provider credential,
  # so it is mandatory on every pull request, including Dependabot and forks.
  # This carries the real broker/supervisor worker recovery and the full
  # 48-class validation the fast critical job deliberately does not run.
  e2e-runtime:
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cronos_test_db
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:size=1073741824
          --health-cmd "pg_isready -U postgres -d cronos_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The whole-source frontend lint, production build and dead-code checks
      # are required on every PR, so they live in this long allowed job. The
      # production dependency audit and the repository script tests
      # also run here, condition-free, after the frontend install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral runtime credentials
        shell: bash
        run: |
          CI_MIGRATOR_PASSWORD="$(openssl rand -hex 24)"
          CI_APP_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${CI_MIGRATOR_PASSWORD}"
          echo "::add-mask::${CI_APP_PASSWORD}"
          echo "CRONOS_MIGRATOR_PASSWORD=${CI_MIGRATOR_PASSWORD}" >> "$GITHUB_ENV"
          echo "CRONOS_APP_PASSWORD=${CI_APP_PASSWORD}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://cronos_app:${CI_APP_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+asyncpg://cronos_app:${CI_APP_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgresql+psycopg2://cronos_migrator:${CI_MIGRATOR_PASSWORD}@localhost:5432/cronos_test_db" >> "$GITHUB_ENV"
      - name: Provision runtime database roles
        env:
          PGHOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_DB: cronos_test_db
        run: |
          sh backend/scripts/provision_database.sh
      - name: Install locked dependencies
        working-directory: backend
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --no-binary=standardwebhooks -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      # The whole-source frontend lint, the production dependency audit and the
      # repository script Node tests are mandatory, but they no longer
      # belong to the fast frontend gate. They run here, unconditionally, in the
      # long job that every pull request (including Dependabot and forks)
      # already runs.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:production
      - name: Test the repository scripts
        working-directory: frontend
        run: npm run test:scripts
      - name: Frontend dead code (default)
        working-directory: frontend
        run: npm run lint:dead-code
      - name: Frontend dead code (production)
        working-directory: frontend
        run: npm run lint:dead-code:production
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Test native cross-layer runtime
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "false"
        run: >-
          python -m pytest -q
          tests/integration/committed/test_worker_process_recovery.py
          tests/unit/test_scheduler_typology_v1.py::test_forty_eight_classes_generate_a_complete_valid_schedule
          tests/unit/test_scheduler_typology_v1.py::test_the_availability_fixture_completes_forty_eight_classes_before_the_preferred_end
          tests/unit/test_scheduler_typology_v1.py::test_recommended_weights_keep_forty_eight_classes_valid_and_not_later
          --junitxml=runtime-results.xml
      # A green pytest exit with skipped or missing cases must never satisfy the
      # aggregate E2E gate. 0 skips, at least 10 collected, and the four
      # required native case identities present and passing.
      - name: Verify the runtime proof is complete
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          REQUIRED = (
              "test_an_owned_worker_never_duplicates_delivery_of_a_queued_job",
              "test_an_owned_worker_process_loss_is_recovered_by_a_real_supervisor",
              "test_forty_eight_classes_generate_a_complete_valid_schedule",
              "test_the_availability_fixture_completes_forty_eight_classes_before_the_preferred_end",
              "test_recommended_weights_keep_forty_eight_classes_valid_and_not_later",
          )
          MIN_COLLECTED = 10
          cases = list(ET.parse("runtime-results.xml").getroot().iter("testcase"))
          names = [case.get("name", "") for case in cases]
          failures = []
          if len(cases) < MIN_COLLECTED:
              failures.append("collected %d < %d" % (len(cases), MIN_COLLECTED))
          for name in REQUIRED:
              if name not in names:
                  failures.append("missing case " + name)
          for case in cases:
              label = case.get("name", "?")
              if case.find("skipped") is not None:
                  failures.append("skipped case " + label)
              if case.find("failure") is not None or case.find("error") is not None:
                  failures.append("failed case " + label)
          if failures:
              raise SystemExit("runtime proof incomplete: " + "; ".join(failures))
          print("runtime proof complete: %d cases" % len(cases))
          PY
      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/runtime-results.xml
          if-no-files-found: warn
          retention-days: 3
