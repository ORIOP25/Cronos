name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  TEST_DATABASE_URL: postgresql+asyncpg://cronos_app:app-ci@localhost:5432/cronos_test_db
  DATABASE_URL: postgresql+asyncpg://cronos_app:app-ci@localhost:5432/cronos_test_db
  MIGRATION_DATABASE_URL: postgresql+psycopg2://cronos_migrator:migrator-ci@localhost:5432/cronos_test_db
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/0
  ENVIRONMENT: local
  SENTRY_DSN: ""
  DATABASE_POOLING_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cronos_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cronos_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Provision database roles
        run: |
          psql postgresql://postgres@localhost/cronos_test_db <<'SQL'
          CREATE ROLE cronos_migrator LOGIN NOSUPERUSER BYPASSRLS PASSWORD 'migrator-ci';
          CREATE ROLE cronos_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'app-ci';
          CREATE ROLE cronos_auth_definer NOLOGIN NOSUPERUSER BYPASSRLS;
          GRANT cronos_auth_definer TO cronos_migrator;
          ALTER DATABASE cronos_test_db OWNER TO cronos_migrator;
          GRANT CONNECT ON DATABASE cronos_test_db TO cronos_app;
          SQL
      - name: Install locked dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency locks
        working-directory: backend
        run: |
          pip-compile --quiet --allow-unsafe --generate-hashes --output-file=requirements.txt requirements.in
          pip-compile --quiet --allow-unsafe --generate-hashes --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt
          pip check
          pip-audit -r requirements.txt --progress-spinner off
      - name: Ruff
        working-directory: backend
        run: |
          ruff format --check .
          ruff check .
      - name: Verify immutable migration
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Test without Redis contracts
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "false"
        run: >-
          coverage run --branch -m pytest -q -m "not redis"
          --junitxml=test-results.xml
      - name: Test Redis contracts and report coverage
        working-directory: backend
        env:
          RATELIMIT_ENABLED: "true"
        run: |
          coverage run --branch --append -m pytest -q -m redis --junitxml=test-results-redis.xml
          coverage report --fail-under=85
          coverage report --include='app/scheduler/domain/constraints.py,app/scheduler/domain/validation.py' --fail-under=100
          python - <<'PY'
          import xml.etree.ElementTree as ET
          files = ("test-results.xml", "test-results-redis.xml")
          skipped = sum(
              int(x.attrib.get("skipped", 0))
              for path in files
              for x in ET.parse(path).iter("testsuite")
          )
          if skipped:
              raise SystemExit(f"{skipped} skipped tests are not allowed")
          PY
      - name: Build hardened backend image
        run: docker build --target runtime -t cronos-backend:test backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm run verify
          npm run test:school-config:stability

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: cronos-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run real Clerk E2E
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          CRONOS_MIGRATOR_PASSWORD: ${{ secrets.CI_MIGRATOR_PASSWORD }}
          CRONOS_APP_PASSWORD: ${{ secrets.CI_APP_PASSWORD }}
        run: docker compose -f docker-compose.ci.yml up --build --abort-on-container-exit --exit-code-from e2e

  publish-backend:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate semantic release tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: backend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cronos-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cronos-backend:${{ github.ref_name }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cronos-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
