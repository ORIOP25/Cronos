name: CI Pipeline (Tests + SonarQube)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-scan:
    name: Tests & SonarQube Scan
    runs-on: ubuntu-latest

    # Serviços Temporários (Sidecars) para os testes backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: horario_zen_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necessário para o SonarQube analisar histórico de commits

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar Dependências Backend
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx pytest-cov

    - name: Instalar Dependências Frontend
      working-directory: ./frontend
      run: npm ci

    - name: Correr Testes Backend (Pytest + Coverage)
      working-directory: ./backend
      env:
        ENVIRONMENT: local
        DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.POSTGRES_TEST_PASSWORD }}@localhost:5432/horario_zen_test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: segredo_super_secreto_apenas_para_testes_ci
        ACCESS_TOKEN_EXPIRE_MINUTES: 60
      run: |
        pytest --cov=app --cov-report=xml:coverage.xml --cov-branch -v -s

    - name: Correr Testes Frontend (Vitest + Coverage)
      working-directory: ./frontend
      run: npx vitest run --coverage

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}