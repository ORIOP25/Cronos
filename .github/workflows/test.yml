name: CI Pipeline (Tests)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    # Serviços Temporários (Sidecars) para o teste
    services:
      # 1. Postgres de Teste
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: horario_zen_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 2. Redis de Teste
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Instalar Dependências
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Correr Testes Backend (Pytest)
      working-directory: ./backend
      env:
        ENVIRONMENT: local
        DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@localhost:5432/horario_zen_test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: segredo_super_secreto_apenas_para_testes_ci
        ACCESS_TOKEN_EXPIRE_MINUTES: 60
      run: |
        pytest -v -s

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar Dependências
      working-directory: ./frontend
      run: npm ci

    - name: Correr Testes Frontend (Vitest)
      working-directory: ./frontend
      run: npx vitest run