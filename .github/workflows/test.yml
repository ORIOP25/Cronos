name: CI Pipeline (Tests + SonarQube)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    # Serviços Temporários (Sidecars) para o teste
    services:
      # 1. Postgres de Teste
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: horario_zen_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 2. Redis de Teste
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Instalar Dependências
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx pytest-cov

    - name: Correr Testes Backend (Pytest + Coverage)
      working-directory: ./backend
      env:
        ENVIRONMENT: local
        DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@localhost:5432/horario_zen_test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: segredo_super_secreto_apenas_para_testes_ci
        ACCESS_TOKEN_EXPIRE_MINUTES: 60
      run: |
        pytest --cov=app --cov-report=xml:coverage.xml --cov-branch -v -s

    - name: Guardar Relatório de Coverage Backend
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage.xml
        retention-days: 1

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar Dependências
      working-directory: ./frontend
      run: npm ci

    - name: Correr Testes Frontend (Vitest + Coverage)
      working-directory: ./frontend
      run: npx vitest run --coverage

    - name: Guardar Relatório de Coverage Frontend
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage/lcov.info
        retention-days: 1

  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Descarregar Coverage Backend
      uses: actions/download-artifact@v4
      with:
        name: backend-coverage
        path: backend

    - name: Descarregar Coverage Frontend
      uses: actions/download-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}