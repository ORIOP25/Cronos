map $http_x_forwarded_proto $hsts_value {
    default "";
    https "max-age=31536000; includeSubDomains";
}

map $http_accept $accept_markdown {
    default 0;
    "~*text/markdown[^,]*q\s*=\s*0(?:\s*,|$)" 0;
    "~*text/markdown(?:\s*;[^,]*)?(?:,|$)" 1;
}

map $accept_markdown $not_found_asset {
    0 /404.html;
    1 /404.md;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    # Resolve the Compose service again after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/html text/markdown;
    # Local development uses the Clerk accounts.dev instance from .env.local.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://clerk.cronos.pt https://*.clerk.accounts.dev https://*.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; connect-src 'self' https://api.cronos.pt https://clerk.cronos.pt https://*.clerk.accounts.dev https://*.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com:*; img-src 'self' data: https://img.clerk.com; font-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src 'self' https://*.clerk.accounts.dev https://*.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; upgrade-insecure-requests" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts_value always;
    add_header Vary Accept always;
    error_page 404 =404 $not_found_asset;
    error_page 418 =200 @homepage_markdown;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        if ($accept_markdown) { return 418; }
        try_files /index.html =404;
    }

    location @homepage_markdown {
        types { text/markdown txt; }
        try_files /llms.txt =404;
    }

    location ~ ^/(?:login|register|sign-in|sign-up)(?:/.*)?/?$ {
        limit_except GET HEAD { deny all; }
        try_files /app-shell.html =404;
    }

    location ~ ^/(?:dashboard|members|rooms|subjects|courses|imports|config|schedules|absences|timesheets|my-schedules|my-progress|my-availability|foundation(?:/waiting)?|guide|recuperar-palavra-passe)(?:/)?$ {
        limit_except GET HEAD { deny all; }
        try_files /app-shell.html =404;
    }

    location ~ ^/courses/[^/]+/classes/[^/]+/subjects/?$ {
        limit_except GET HEAD { deny all; }
        try_files /app-shell.html =404;
    }

    location ~ ^/courses/[^/]+/classes/[^/]+/?$ {
        limit_except GET HEAD { deny all; }
        try_files /app-shell.html =404;
    }

    location ~ ^/courses/[^/]+/?$ {
        limit_except GET HEAD { deny all; }
        try_files /app-shell.html =404;
    }

    location = /llms.txt {
        types { text/markdown txt; }
        try_files /llms.txt =404;
    }

    location = /404.md {
        types { text/markdown md; }
        try_files /404.md =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
