[project]
name = "horario-zen-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Testes puros sem BD nem rede (schemas, funções puras)",
    "integration: Testes com BD de teste (requer PostgreSQL)",
    "postgresql: Testes que exigem schema PostgreSQL criado por Alembic",
    "slow: Testes lentos (>1s) — excluídos por defeito",
    "solver: Testes do motor de horários (CP-SAT / OR-Tools)",
]
