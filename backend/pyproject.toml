[project]
name = "cronos-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers", "-ra", "--tb=short"]
markers = [
    "postgresql: Testes que exigem schema PostgreSQL criado por Alembic",
    "redis: Testes que exigem Redis real",
    "slow_solver: Prova CP-SAT longa; o perfil fast exclui-a e a CI corre-a",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
