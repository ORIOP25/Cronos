; DEPRECATED: Migrado para pyproject.toml ([tool.pytest.ini_options]).
; Este ficheiro é mantido para compatibilidade. Remover após validação.
[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    unit: Testes puros sem BD nem rede (schemas, funções puras)
    integration: Testes com BD de teste (requer PostgreSQL)
    slow: Testes lentos (>1s) — excluídos por defeito
    solver: Testes do motor de horários (CP-SAT / OR-Tools)
