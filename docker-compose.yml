services:
  # 1. Base de Dados (Igual ao antigo)
  db:
    image: postgres:15-alpine
    container_name: horario_zen_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: horario_zen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: horario_zen_redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend API
  backend: 
    build: ./backend
    container_name: horario_zen_backend
    expose:
      - "8000" # A porta 8000 fica fechada para fora, só o Nginx a vê
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:mysecretpassword@db:5432/horario_zen_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Worker Celery
  worker:
    build: ./backend # Usa o mesmo Dockerfile do backend
    container_name: horario_zen_worker
    command: sh -c "sleep 5 && celery -A app.celery_worker.celery_app worker --loglevel=info"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:mysecretpassword@db:5432/horario_zen_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
      - db

  # 5. Frontend (Nginx Reverse Proxy) - O Porteiro
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: horario_zen_frontend
    # Mapear a porta do Vite (5173) para o teu PC
    ports:
      - "5173:5173"
    command: npm run dev
    volumes:
      # Sincroniza a pasta do teu PC com o Container
      - ./frontend:/app
      # Truque importante: impede que o node_modules do teu PC estrague o do Linux
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Ajuda o Windows a detetar saves
    depends_on:
      - backend

volumes:
  postgres_data: