name: horario_zen

# Credenciais definidas via variáveis de ambiente ou ficheiro .env na raiz.
# Exemplo de .env (NUNCA comitar):
#   POSTGRES_USER=postgres
#   POSTGRES_PASSWORD=<senha_segura>
#   POSTGRES_DB=horario_zen_db
#   BOOTSTRAP_ADMIN_PASSWORD=<senha_admin_segura>
#   REDIS_PASSWORD=<senha_redis_opcional>

services:
  # 1. Base de Dados
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definida no .env}
      POSTGRES_DB: ${POSTGRES_DB:-horario_zen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (com persistência AOF)
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend API
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-horario_zen_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=1
      - BOOTSTRAP_DEFAULT_ADMIN=0
      - BOOTSTRAP_ADMIN_EMAIL=admin@horariozen.local
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-admin1234}
      - BOOTSTRAP_ADMIN_NAME=Admin Apérius
      - BOOTSTRAP_ORG_NAME=Escola Demo Apérius

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # 4. Worker Celery
  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_worker.celery_app", "worker", "--loglevel=info"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-horario_zen_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=0
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # 5. Celery Beat — Scheduler de tarefas periódicas (cron diário às 23:59)
  beat:
    build: ./backend
    command: ["celery", "-A", "app.celery_worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-horario_zen_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=0
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # 6. Frontend (Vite Dev Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: horario_zen_postgres_data
  redis_data:
    name: horario_zen_redis_data